<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 260px; margin: 0; padding: 14px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1f1f1f; }
      h1 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
      h1 img { width: 20px; height: 20px; }
      .status { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #9ca3af; }
      .dot.connected { background: #16a34a; }
      p { margin: 0 0 10px; color: #555; }
      code { background: #f3f0ff; padding: 1px 4px; border-radius: 4px; }
      label { display: flex; align-items: center; gap: 6px; color: #555; }
      input { width: 70px; padding: 3px 6px; border: 1px solid #ccc; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1><img src="icons/icon48.png" alt="" />Agent S</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Checking…</span></div>
    <p id="hint">Run <code>agent_s --browser --task "…"</code> in a terminal. Agent S works in its own purple tab group with its own cursor.</p>
    <label>Port <input id="port" type="number" min="1024" max="65535" /></label>
    <script src="popup.js"></script>
  </body>
</html>
